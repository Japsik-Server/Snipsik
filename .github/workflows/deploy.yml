name: Deploy to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: japsik-507607
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: snipsik
  IMAGE_NAME: snipsik
  VM_NAME: snipsik
  VM_ZONE: us-central1-a
  CONTAINER_NAME: snipsik-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy container to GCP VM via gcloud compute ssh
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet \
            --command="
              set -e
              IMAGE_URI=\"$IMAGE_URI\"
              ENV_FILE=\"\$HOME/snipsik/.env\"

              echo '==> 1. Checking prerequisites...'
              if [ ! -f \"\$ENV_FILE\" ]; then
                echo \"Error: Environment file \$ENV_FILE does not exist on VM!\" >&2
                exit 1
              fi

              echo '==> 2. Configuring Artifact Registry auth on VM...'
              gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

              echo \"==> 3. Pulling target image (\$IMAGE_URI)...\"
              docker pull \"\$IMAGE_URI\"

              echo '==> 4. Preparing container switch...'
              BACKUP_CONTAINER=\"${{ env.CONTAINER_NAME }}-backup\"
              docker rm -f \"\$BACKUP_CONTAINER\" 2>/dev/null || true

              HAS_OLD=0
              if docker ps -a --format '{{.Names}}' | grep -Eq \"^${{ env.CONTAINER_NAME }}\$\"; then
                HAS_OLD=1
                echo \"Backing up existing container to \$BACKUP_CONTAINER...\"
                docker rename ${{ env.CONTAINER_NAME }} \"\$BACKUP_CONTAINER\"
                docker stop \"\$BACKUP_CONTAINER\" || true
              fi

              echo '==> 5. Starting new container...'
              if ! docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                --restart unless-stopped \
                --env-file \"\$ENV_FILE\" \
                \"\$IMAGE_URI\"; then
                echo \"Error: docker run failed! Rolling back...\" >&2
                if [ \"\$HAS_OLD\" -eq 1 ]; then
                  docker start \"\$BACKUP_CONTAINER\" || true
                  docker rename \"\$BACKUP_CONTAINER\" ${{ env.CONTAINER_NAME }} || true
                fi
                exit 1
              fi

              echo '==> 6. Verifying container health...'
              sleep 5
              IS_RUNNING=\$(docker inspect -f '{{.State.Running}}' ${{ env.CONTAINER_NAME }} 2>/dev/null || echo \"false\")
              if [ \"\$IS_RUNNING\" != \"true\" ]; then
                echo \"Error: Container exited unexpectedly! Logs:\" >&2
                docker logs --tail 30 ${{ env.CONTAINER_NAME }} >&2 || true
                echo \"Rolling back to previous container...\" >&2
                docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
                if [ \"\$HAS_OLD\" -eq 1 ]; then
                  docker start \"\$BACKUP_CONTAINER\" || true
                  docker rename \"\$BACKUP_CONTAINER\" ${{ env.CONTAINER_NAME }} || true
                  echo \"Rollback complete.\" >&2
                fi
                exit 1
              fi

              # Clean up backup container after successful deployment
              if [ \"\$HAS_OLD\" -eq 1 ]; then
                docker rm -f \"\$BACKUP_CONTAINER\" 2>/dev/null || true
              fi

              echo '==> 7. Cleaning up dangling images...'
              docker image prune -f

              echo '==> 8. Deployment succeeded! Container status:'
              docker ps --filter name=${{ env.CONTAINER_NAME }}
            "
