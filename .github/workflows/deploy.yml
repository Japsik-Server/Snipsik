name: Deploy to GCP VM

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock*"
      - "tsconfig.json"
      - "drizzle/**"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force Docker image build and push (bypass Artifact Registry cache)"
        required: false
        type: boolean
        default: false
      force_deploy:
        description: "Force container redeploy/restart on VM"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: japsik-507607
  WIF_PROVIDER: projects/992944582728/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-actions@japsik-507607.iam.gserviceaccount.com
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: snipsik
  IMAGE_NAME: snipsik
  VM_NAME: snipsik
  VM_ZONE: us-central1-a
  VM_USER: japsik
  CONTAINER_NAME: snipsik-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Check if image already exists in Artifact Registry
        id: check-image
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          # Resolve base image digest from Docker Hub to capture upstream base image updates
          BASE_DIGEST=$(docker buildx imagetools inspect oven/bun:1-alpine --format '{{.Manifest.Digest}}' 2>/dev/null || echo "oven/bun:1-alpine")

          # Compute deterministic content hash of files affecting the container image and base image digest
          BUILD_HASH=$( (git ls-files -s Dockerfile .dockerignore package.json "bun.lock*" tsconfig.json src; echo "$BASE_DIGEST") | sha256sum | awk '{print substr($1, 1, 12)}')
          IMAGE_TAG="sha-${BUILD_HASH}"
          TARGET_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "target_image=${TARGET_IMAGE}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "force_build is enabled. Bypassing Artifact Registry cache and proceeding with build and push."
          elif gcloud artifacts docker images describe "$TARGET_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $TARGET_IMAGE already exists in Artifact Registry. Skipping build and push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $TARGET_IMAGE does not exist. Proceeding with build and push."
          fi

      - name: Configure Docker authentication for Artifact Registry
        if: steps.check-image.outputs.exists != 'true'
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push Docker image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.check-image.outputs.target_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare environment file with dotenv
        env:
          APP_ENV: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "Error: ENV_FILE secret is not configured in GitHub repository secrets!" >&2
            exit 1
          fi
          npm install --no-save dotenv@17.4.2
          node scripts/parse-env.js .env.prod

      - name: Check deployment necessity on VM
        id: check-deploy
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          FORCE_BUILD: ${{ inputs.force_build }}
          IMAGE_EXISTS: ${{ steps.check-image.outputs.exists }}
          TARGET_IMAGE: ${{ steps.check-image.outputs.target_image }}
          TARGET: ${{ env.VM_USER }}@${{ env.VM_NAME }}
        run: |
          if [ "$FORCE_DEPLOY" = "true" ] || [ "$FORCE_BUILD" = "true" ]; then
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=Forced deployment requested via workflow_dispatch" >> "$GITHUB_OUTPUT"
            echo "==> Forced deployment requested. Proceeding with deployment."
            exit 0
          fi

          if [ "$IMAGE_EXISTS" != "true" ]; then
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=New container image built and pushed" >> "$GITHUB_OUTPUT"
            echo "==> New container image was built. Proceeding with deployment."
            exit 0
          fi

          LOCAL_ENV_HASH=$(sha256sum .env.prod | awk '{print $1}')

          echo "==> Verifying current VM container state and environment..."
          VM_STATUS=$(gcloud compute ssh "$TARGET" \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet \
            --command="
              set -e
              DOCKER='docker'
              docker info >/dev/null 2>&1 || DOCKER='sudo docker'
              RUNNING=\$(\$DOCKER inspect -f '{{.State.Running}}' '${{ env.CONTAINER_NAME }}' 2>/dev/null || echo 'false')
              IMAGE=\$(\$DOCKER inspect -f '{{.Config.Image}}' '${{ env.CONTAINER_NAME }}' 2>/dev/null || echo '')
              ENV_HASH=\$(sha256sum ~/snipsik/.env 2>/dev/null | awk '{print \$1}' || echo '')
              echo \"\$RUNNING|\$IMAGE|\$ENV_HASH\"
            " 2>/dev/null || echo "error")

          if [ "$VM_STATUS" = "error" ] || [ -z "$VM_STATUS" ]; then
            echo "Warning: Unable to verify VM state via SSH. Failing open to deploy."
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=VM state check failed; deploying for safety" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VM_RUNNING=$(echo "$VM_STATUS" | cut -d'|' -f1)
          VM_IMAGE=$(echo "$VM_STATUS" | cut -d'|' -f2)
          VM_ENV_HASH=$(echo "$VM_STATUS" | cut -d'|' -f3)

          if [ "$VM_RUNNING" = "true" ] && [ "$VM_IMAGE" = "$TARGET_IMAGE" ] && [ "$VM_ENV_HASH" = "$LOCAL_ENV_HASH" ]; then
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=Container is already running target image ($TARGET_IMAGE) with identical configuration" >> "$GITHUB_OUTPUT"
            echo "==> Container is already running target image with identical configuration. Skipping deployment."
          else
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=State mismatch detected (running: $VM_RUNNING, image_match: $([ "$VM_IMAGE" = "$TARGET_IMAGE" ] && echo true || echo false), env_match: $([ "$VM_ENV_HASH" = "$LOCAL_ENV_HASH" ] && echo true || echo false))" >> "$GITHUB_OUTPUT"
            echo "==> State mismatch detected on VM. Proceeding with deployment."
          fi

      - name: Deploy container to GCP VM via gcloud compute ssh
        if: steps.check-deploy.outputs.needs_deploy == 'true'
        run: |
          IMAGE_URI="${{ steps.check-image.outputs.target_image }}"
          DEPLOY_TMP="/tmp/snipsik-deploy-${{ github.sha }}"
          TARGET="${{ env.VM_USER }}@${{ env.VM_NAME }}"

          vm_ssh() {
            gcloud compute ssh "$TARGET" \
              --zone=${{ env.VM_ZONE }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              --quiet \
              --command="$1"
          }

          vm_scp() {
            gcloud compute scp "$@" \
              --zone=${{ env.VM_ZONE }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              --quiet
          }

          echo "==> Creating temporary deployment directory on VM..."
          vm_ssh "mkdir -p $DEPLOY_TMP"

          echo "==> Uploading deployment files to temporary directory..."
          vm_scp .env.prod scripts/deploy.sh "$TARGET:$DEPLOY_TMP/"

          echo "==> Atomically applying files and executing deployment script on VM..."
          vm_ssh "
            set -e
            mkdir -p ~/snipsik
            chmod 600 '$DEPLOY_TMP/.env.prod'
            mv -f '$DEPLOY_TMP/.env.prod' ~/snipsik/.env
            chmod +x '$DEPLOY_TMP/deploy.sh'
            mv -f '$DEPLOY_TMP/deploy.sh' ~/snipsik/deploy.sh
            rm -rf '$DEPLOY_TMP'
            bash ~/snipsik/deploy.sh '$IMAGE_URI' '${{ env.CONTAINER_NAME }}' '${{ env.GAR_LOCATION }}' '~/snipsik/.env'
          "

      - name: Generate deployment summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 GCP Deployment Summary

          | Item | Status |
          |------|--------|
          | **Target Image** | `${{ steps.check-image.outputs.target_image || 'N/A' }}` |
          | **Image Build** | ${{ steps.check-image.outputs.exists == 'true' && '⏭️ Skipped (Cache Hit)' || (steps.check-image.outputs.exists == 'false' && '🔨 Built & Pushed' || 'N/A') }} |
          | **VM Deployment** | ${{ steps.check-deploy.outputs.needs_deploy == 'true' && '🚀 Deployed' || (steps.check-deploy.outputs.needs_deploy == 'false' && '⏭️ Skipped (Up-to-date)' || 'N/A') }} |
          | **Reason** | ${{ steps.check-deploy.outputs.reason || 'N/A' }} |
          EOF

      - name: Clean up temporary files on runner
        if: always()
        run: |
          rm -f .env.prod
