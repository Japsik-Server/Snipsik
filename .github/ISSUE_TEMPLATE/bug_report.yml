name: 🐛 Bug Report / 버그 리포트
description: Create a report to help us improve / 버그를 제보하여 문제를 해결합니다
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📌 안내 / Notice
        - 이슈 본문은 **한국어**로 작성해 주세요. (Please write the issue content in **Korean**.)
        - 보안 취약점 관련 제보는 공개 이슈가 아닌 [비공개 보안 권고](https://github.com/Japsik-Server/Snipsik/security/advisories/new)를 통해 접수해 주세요.
  - type: textarea
    id: description
    attributes:
      label: 버그 설명 / Bug Description
      description: 발생한 버그를 명확하고 간결하게 설명해 주세요. (A clear and concise description of the bug.)
      placeholder: 어떤 문제가 발생했는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차 / Steps to Reproduce
      description: 문제를 재현할 수 있는 상세 단계를 알려주세요. (Steps to reproduce the behavior.)
      placeholder: |
        1. `/link shorten ...` 실행
        2. ...
        3. 오류 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작 / Expected Behavior
      description: 정상적으로 기대되는 동작을 설명해 주세요. (What you expected to happen.)
      placeholder: 정상적인 동작 방식에 대해 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 및 로그 / Actual Behavior & Logs
      description: 실제로 일어난 동작 및 콘솔 로그/에러 메시지를 붙여넣어 주세요. (What actually happened and relevant error logs.)
      placeholder: 발생한 에러 메시지나 로그를 적어주세요.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 환경 정보 / Environment
      description: 실행 환경 정보를 입력해 주세요. (Runtime environment details.)
      value: |
        - OS: [e.g. Linux / macOS / Windows WSL2]
        - Bun Version: [e.g. 1.2.0]
        - Deployment: [e.g. Local / Docker / GCP VM]
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 사전 확인 / Checklist
      description: 이슈 등록 전 아래 항목을 확인해 주세요. (Please verify these before submitting.)
      options:
        - label: 기존 등록된 중복 이슈가 없는지 검색했습니다. (I have searched existing issues for duplicates.)
          required: true
        - label: 본문 내용이 한국어로 작성되었습니다. (The issue content is written in Korean.)
          required: true
