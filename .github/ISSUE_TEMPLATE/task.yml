name: 📋 Task & Chore / 작업 및 개선
description: Refactoring, documentation, or maintenance / 리팩토링, 문서 개선, 유지보수 작업
title: "[Task]: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📌 안내 / Notice
        - 이슈 본문은 **한국어**로 작성해 주세요. (Please write the issue content in **Korean**.)
  - type: textarea
    id: overview
    attributes:
      label: 작업 개요 / Overview
      description: 수행할 작업의 목적과 범위를 설명해 주세요. (Describe the purpose and scope of the task.)
      placeholder: 어떤 작업(리팩토링, 문서화, CI/CD 개선 등)을 수행할지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 세부 작업 항목 / To-Do Items
      description: 구체적인 작업 체크리스트를 나열해 주세요. (List specific task items.)
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 사전 확인 / Checklist
      options:
        - label: 기존 등록된 중복 작업 이슈가 없는지 검색했습니다. (I have searched existing issues for duplicates.)
          required: true
        - label: 본문 내용이 한국어로 작성되었습니다. (The issue content is written in Korean.)
          required: true
