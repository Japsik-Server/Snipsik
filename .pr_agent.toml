[config]
model = "openrouter/openai/gpt-5.6-sol"
model_weak = "openrouter/z-ai/glm-5.3-flash"
fallback_models = ["openrouter/z-ai/glm-5.3-flash"]
custom_model_max_tokens = 128000
response_language = "en"
persistent_inline_comments = true
patch_extension_skip_types = [".md", ".txt", ".json", ".lock", ".svg", ".csv", "bun.lock", "bun.lockb"]
ignore_pr_title = ["^\\[Auto\\]", "^Auto", "^chore\\(deps\\)", "^chore\\(deps-dev\\)"]

[openrouter]
provider_only = ["openai/flex", "google-ai-studio/flex", "deepinfra", "z-ai"]
reasoning_effort = "low"
reasoning_max_tokens = 2048

[model_routing]
enable = true
rules = [
  { max_files = 2, max_hunks = 4, model = "openrouter/z-ai/glm-5.3-flash" },
  { max_files = 6, max_hunks = 15, model = "openrouter/openai/gpt-5.6-luna" },
  { max_files = 12, max_hunks = 30, model = "openrouter/google/gemini-3.8-flash" }
]

[github_action_config]
auto_review = false
auto_describe = false
auto_improve = false
feedback_on_draft_pr = false

[github_app]
feedback_on_draft_pr = false

[pr_description]
publish_description_as_comment = true
add_lgtm = false

[pr_reviewer]
inline_key_issues = true
num_max_findings = 5
enable_auto_approval = false
enable_review_labels_effort = true
require_all_thresholds_for_passing = false

[pr_code_suggestions]
commitable_code_suggestions = true
focus_only_on_problems = true

[pr_questions]
resolve_threads = true
